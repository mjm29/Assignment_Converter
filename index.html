<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Converter</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  <!--Nav Bar-->
  <nav class="bg-white shadow-md fixed w-full top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-wrap gap-8 h-16">
        <div class="flex-shrink-0 flex items-center">
          <a href="#" class="text-xl font-bold text-blue-600">Unit Converter</a>
        </div>
        <!--Link to each tab -->
        <div class="flex gap-8 items-center">
          <a href="#" id="weight" class="text-gray-700 hover:text-blue-600 font-medium">Weight</a>
          <a href="#" id="distance" class="text-gray-700 hover:text-blue-600 font-medium">Distance</a>
          <a href="#" id="temperature" class="text-gray-700 hover:text-blue-600 font-medium">Temperature</a>
        </div>
      </div>
    </div>
  </nav>
  <main class="flex justify-center items-center min-h-screen bg-slate-200">
    <!--Weight card-->
    <form id="weight-card" class="bg-white rounded-2xl shadow-md p-6">
      <div class="flex justify-between">  
        <h3 class="text-lg font-bold text-slate-900">Weight</h3>
        <!-- CRITICAL: Added type="button" so clicking this doesn't accidentally submit the form -->
        <button id="swap-btn-weight" type="button" class="text-md p-2 text-slate-900 bg-slate-300 rounded-3xl hover:bg-slate-400">
          🔁lbs to kg
        </button>
      </div>
      <p class="text-sm text-slate-500 mt-1">Kilograms to pounds</p>
      <label for="weight-input" class="block text-sm font-medium text-slate-700 mt-5 mb-2">
        Kilograms
      </label>
      <input
        id="weight-input"
        type="number"
        value="0"
        class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900 focus:border-blue-500 focus:outline-none"
      />
      <button
        id="weight-button"
        type="submit"
        class="w-full mt-4 rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white hover:bg-blue-700 transition cursor-pointer"
      >
          Convert
      </button>
      <div class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
        <p class="text-xs uppercase tracking-wide text-slate-500">Pounds</p>
        <p id="weight-result" class="text-2xl font-bold text-blue-600 mt-1">0.00</p>
      </div>
    </form>
    <!--Distance card-->
    <form id="distance-card" class="hidden bg-white rounded-2xl shadow-md p-6">
      <div class="flex justify-between">  
        <h3 class="text-lg font-bold text-slate-900">Distance</h3>
        <button id="swap-btn-distance" type="button" class="text-md p-2 text-slate-900 bg-slate-300 rounded-3xl hover:bg-slate-400">
          🔁km to mi
        </button>
      </div>
      <p class="text-sm text-slate-500 mt-1">Miles to Kilometres</p>
      <label for="distance-input" class="block text-sm font-medium text-slate-700 mt-5 mb-2">
        Miles
      </label>
      <input
        id="distance-input"
        type="number"
        value="0"
        class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900
        focus:border-blue-500 focus:outline-none"
      />
      <button
        id="distance-button"
        type="submit"
        class="w-full mt-4 rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white
        hover:bg-blue-700 transition cursor-pointer"
      >
          Convert
      </button>
      <div class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
        <p class="text-xs uppercase tracking-wide text-slate-500">Kilometres</p>
        <p id="distance-result" class="text-2xl font-bold text-blue-600 mt-1">0.00</p>
      </div>
    </form>
    <!--Temp card-->
    <form id="temperature-card" class="hidden bg-white rounded-2xl shadow-md p-6">
       <div class="flex justify-between">  
        <h3 class="text-lg font-bold text-slate-900">Temperature</h3>
        <button id="swap-btn-temperature" type="button" class="text-md p-2 text-slate-900 bg-slate-300 rounded-3xl hover:bg-slate-400">
          🔁℉ to ℃
        </button>
      </div>
      <p class="text-sm text-slate-500 mt-1">Celsius to Farenheit</p>
      <label for="temperature-input" class="block text-sm font-medium text-slate-700 mt-5 mb-2">
        Celsius
      </label>
      <input
        id="temperature-input"
        type="number"
        value="0"
        class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900
        focus:border-blue-500 focus:outline-none"
      />
      <button
        id="temperature-button"
        type="submit"
        class="w-full mt-4 rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white
        hover:bg-blue-700 transition cursor-pointer"
      >
          Convert
      </button>
      <div class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
        <p class="text-xs uppercase tracking-wide text-slate-500">Farenheit</p>
        <p id="temperature-result" class="text-2xl font-bold text-blue-600 mt-1">0.00</p>
      </div>
    </form>
  </main>
  <script type="module" src="/main.js"></script>
</body>
</html>
