<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Convert — Unit Converter</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
        },
        colors: {
          teal: {
            300: '#5EEAD4',
          },
          ink: {
            950: '#0A0E12',
            900: '#10161C',
            800: '#1A222A',
            700: '#2A343D',
            400: '#8A97A3',
            200: '#DCE3E8',
          },
        },
      },
    },
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
</style>
</head>
<body class="bg-ink-950 text-ink-200 min-h-screen flex flex-col">

  <!-- Navbar -->
  <header class="border-b border-ink-700">
    <div class="max-w-3xl mx-auto px-6 py-5 flex items-center justify-between flex-wrap gap-4">
      <div class="flex items-center gap-2">
        <span class="mono text-teal-300 text-lg">⇄</span>
        <span class="text-lg font-semibold tracking-tight">Convert</span>
      </div>
      <nav class="flex gap-6 mono text-sm">
        <a id="weight" href="#" class="pb-1 border-b-2 text-teal-300 border-teal-300 transition-colors">weight</a>
        <a id="distance" href="#" class="pb-1 border-b-2 border-transparent text-ink-400 hover:text-ink-200 transition-colors">distance</a>
        <a id="temperature" href="#" class="pb-1 border-b-2 border-transparent text-ink-400 hover:text-ink-200 transition-colors">temperature</a>
      </nav>
    </div>
  </header>

  <main class="flex-1 flex items-start justify-center px-6 py-12">
    <div class="w-full max-w-md">

      <!-- Weight card -->
      <form id="weight-card" class="bg-ink-900 border border-ink-700 rounded-lg p-6">
        <div class="flex items-center justify-between mb-6">
          <p id="current-conversion-weight" class="text-sm text-ink-400 mono">Kilograms to Pounds</p>
          <button type="button" id="swap-btn-weight" class="mono text-xs px-3 py-1.5 rounded border border-ink-700 text-teal-300 hover:bg-ink-800 transition-colors">🔁 kg to lbs</button>
        </div>

        <label for="weight-input" class="block text-sm font-medium mb-2">Kilograms</label>
        <textarea id="weight-input" rows="2" placeholder="70 or 70, 82, 55" class="w-full bg-ink-950 border border-ink-700 rounded-md px-3 py-2 text-sm mono placeholder:text-ink-700 focus:outline-none focus:ring-2 focus:ring-teal-300 focus:border-transparent resize-none"></textarea>
        <p class="text-xs text-ink-400 mt-2">Enter one value, or several separated by commas.</p>

        <button type="submit" class="mt-5 w-full bg-teal-300 text-ink-950 font-semibold text-sm py-2.5 rounded-md hover:bg-teal-200 transition-colors">Convert</button>

        <div class="mt-6 pt-5 border-t border-ink-700">
          <p id="weight-result-label" class="text-sm text-ink-400 mb-1">Pounds</p>
          <p id="weight-result" class="mono text-2xl text-ink-200">—</p>
        </div>
      </form>

      <!-- Distance card -->
      <form id="distance-card" class="hidden bg-ink-900 border border-ink-700 rounded-lg p-6">
        <div class="flex items-center justify-between mb-6">
          <p id="current-conversion-distance" class="text-sm text-ink-400 mono">Miles to Kilometres</p>
          <button type="button" id="swap-btn-distance" class="mono text-xs px-3 py-1.5 rounded border border-ink-700 text-teal-300 hover:bg-ink-800 transition-colors">🔁 mi to km</button>
        </div>

        <label for="distance-input" class="block text-sm font-medium mb-2">Miles</label>
        <textarea id="distance-input" rows="2" placeholder="26.2 or 5, 10, 26.2" class="w-full bg-ink-950 border border-ink-700 rounded-md px-3 py-2 text-sm mono placeholder:text-ink-700 focus:outline-none focus:ring-2 focus:ring-teal-300 focus:border-transparent resize-none"></textarea>
        <p class="text-xs text-ink-400 mt-2">Enter one value, or several separated by commas.</p>

        <button type="submit" class="mt-5 w-full bg-teal-300 text-ink-950 font-semibold text-sm py-2.5 rounded-md hover:bg-teal-200 transition-colors">Convert</button>

        <div class="mt-6 pt-5 border-t border-ink-700">
          <p id="distance-result-label" class="text-sm text-ink-400 mb-1">Kilometres</p>
          <p id="distance-result" class="mono text-2xl text-ink-200">—</p>
        </div>
      </form>

      <!-- Temperature card -->
      <form id="temperature-card" class="hidden bg-ink-900 border border-ink-700 rounded-lg p-6">
        <div class="flex items-center justify-between mb-6">
          <p id="current-conversion-temperature" class="text-sm text-ink-400 mono">Celsius to Fahrenheit</p>
          <button type="button" id="swap-btn-temperature" class="mono text-xs px-3 py-1.5 rounded border border-ink-700 text-teal-300 hover:bg-ink-800 transition-colors">🔁 ℃ to ℉</button>
        </div>

        <label for="temperature-input" class="block text-sm font-medium mb-2">Celsius</label>
        <textarea id="temperature-input" rows="2" placeholder="0 or -10, 0, 37, 100" class="w-full bg-ink-950 border border-ink-700 rounded-md px-3 py-2 text-sm mono placeholder:text-ink-700 focus:outline-none focus:ring-2 focus:ring-teal-300 focus:border-transparent resize-none"></textarea>
        <p class="text-xs text-ink-400 mt-2">Enter one value, or several separated by commas.</p>

        <button type="submit" class="mt-5 w-full bg-teal-300 text-ink-950 font-semibold text-sm py-2.5 rounded-md hover:bg-teal-200 transition-colors">Convert</button>

        <div class="mt-6 pt-5 border-t border-ink-700">
          <p id="temperature-result-label" class="text-sm text-ink-400 mb-1">Fahrenheit</p>
          <p id="temperature-result" class="mono text-2xl text-ink-200">—</p>
        </div>
      </form>

    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
